upstream api_backend {
    server api:8000;
}

# No anunciar la version de nginx, ni en la cabecera `Server` ni en sus paginas
# de error. Por si sola no para nada: quien quiera atacar prueba los exploits
# igual. Lo que evita es salir en los buscadores de servidores vulnerables el
# dia que se publique un fallo de esta version concreta, que es como llega la
# mayoria del trafico automatizado.
server_tokens off;

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Las cabeceras de seguridad NO se ponen aqui, y merece la pena decir por
    # que: la principal es la CSP, lleva un `nonce` distinto en cada peticion, y
    # ese valor tiene que ser el mismo en la cabecera y en cada <script> del
    # HTML. Nginx sabe poner cabeceras fijas pero no inyectar nada en el cuerpo
    # que sirve el backend, asi que la unica forma de casarlos es generarlos
    # donde se renderiza la pagina: app/middleware.py.
    #
    # Aqui iria HSTS, que si es fija. Va con TLS y todavia no hay: sobre HTTP
    # el navegador la ignora, y ponerla antes de tener certificado solo sirve
    # para que el dia que se active nadie recuerde por que estaba.

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Health check del propio nginx
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Todo lo demás se reenvía al api Flask
    location / {
        proxy_pass         http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

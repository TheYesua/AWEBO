# Dónde buscar cadenas traducibles al ejecutar `pybabel extract`.
#
# Las plantillas Jinja se extraen con la extensión de jinja2, que entiende
# {% trans %} y {{ _('...') }}. `silent=false` hace que un error de sintaxis
# en una plantilla falle la extracción en lugar de pasar de largo: una
# plantilla que no se extrae es una pantalla que se queda sin traducir sin
# que nadie se entere.
[python: app/**.py]
[jinja2: app/templates/**.html]
silent = false

name: awebo

services:
  postgres:
    image: postgres:16-alpine
    container_name: awebo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: awebo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: awebo-api:latest
    container_name: awebo-api
    restart: unless-stopped
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 --timeout 60 "app:create_app()"
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SESSION_REDIS_URL: redis://redis:6379/3
      AI_PROVIDER: ${AI_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_MODELOS: ${OPENAI_MODELOS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_MODELOS: ${GEMINI_MODELOS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: awebo-api:latest
    container_name: awebo-worker
    restart: unless-stopped
    command: celery -A app.celery_worker:celery_app worker --loglevel=INFO --concurrency=2
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AI_PROVIDER: ${AI_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_MODELOS: ${OPENAI_MODELOS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_MODELOS: ${GEMINI_MODELOS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  # Planificador. Proceso aparte del worker a propósito: beat solo encola, no
  # ejecuta, y debe haber exactamente UNA instancia. Si viviera dentro del
  # worker (con `--beat`), escalar el worker a dos réplicas duplicaría cada
  # tarea programada. Separados se puede escalar el worker con libertad.
  beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: awebo-api:latest
    container_name: awebo-beat
    restart: unless-stopped
    # El calendario vive en `celery_app.conf.beat_schedule`, bajo control de
    # versiones. El fichero de estado va a /tmp porque solo guarda cuándo se
    # ejecutó cada tarea por última vez: perderlo al recrear el contenedor
    # como mucho adelanta o retrasa una ejecución de un purgado diario.
    command: >
      celery -A app.celery_worker:celery_app beat
      --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    environment:
      FLASK_ENV: ${FLASK_ENV}
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: awebo-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  adminer:
    image: adminer:latest
    container_name: awebo-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8091}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dev"]
    networks:
      - backend

volumes:
  postgres_data:
    name: awebo_postgres_data
  redis_data:
    name: awebo_redis_data

networks:
  backend:
    name: awebo_backend
    driver: bridge
